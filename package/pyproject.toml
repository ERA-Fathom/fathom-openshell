[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "right-rudder-openshell"
version = "0.3.0"
description = "Capture the model traffic and delivery record of NVIDIA OpenShell sandboxes, and send them to the right-rudder read."
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["grpcio>=1.84", "protobuf>=7.35", "right-rudder>=0.7.0", "openshell>=0.1.2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["right_rudder_openshell*"]
