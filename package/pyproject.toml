[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "fathom-openshell"
version = "0.2.1"
description = "Capture the model traffic and delivery record of NVIDIA OpenShell sandboxes, and send them to the fathom read."
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["grpcio>=1.84", "protobuf>=7.35", "fathom-read>=0.5", "openshell>=0.1.2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["fathom_openshell*"]
